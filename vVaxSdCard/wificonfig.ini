; vVax network configuration
; Copy this to wificonfig-NAME.ini to create a named variant.
; Leave ssid/password blank to use secrets.h fallbacks.

[wifi]
ssid     =
password =
hostname = vVax

[ntp]
enabled = true
server  = pool.ntp.org

[telnet]
enabled = true
port    = 23

[ftp]
; Passive-mode FTP server exposing the SD card root.
; Control port = port; passive data = port+1.
enabled  = true
port     = 21
user     = esp32
password = esp32
