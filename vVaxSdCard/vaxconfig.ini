; vVax MicroVAX II configuration
; Copy this folder to the root of a FAT32 SD card.

[system]
title  = MicroVAX II
; Guest RAM in MB. Allowed values: 2, 4, or 6.
ram_mb = 6

[console]
; VT100 on TFT + Telnet + USB. Escapes: \r \n \e ^C \x1B
boot_text = ""

[disks]
; Two MSCP slots (RQDX3-class).
; a = installed system disk (create via Open SIMH install onto ra92, then copy here).
; b = NetBSD 10.1 vax install ISO (CD image; CDROM CSR support comes later).
a =
b = /disks/NetBSD-10.1-vax.iso
boot = a

[clock]
enabled = true

[ethernet]
; Secondary: DELQA-class guest Ethernet + NAT (vpdp1170 semantics).
enabled    = false
mac        = 08-00-2B-AA-00-01
guest_ip   = 10.11.0.2
guest_mask = 255.255.255.0
gateway_ip = 10.11.0.1
