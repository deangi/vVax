; vVax MicroVAX II configuration
; Copy this folder to the root of a FAT32 SD card.

[system]
title  = MicroVAX II
; Guest RAM in MB. Allowed values: 2, 4, 6, or 8.
ram_mb = 8
; Host boot path (default netbsd if omitted). Aliases: bsd, openvms.
; os = netbsd
; os = vms

[console]
; VT100 on TFT + Telnet + USB. Escapes: \r \n \e ^C \x1B
boot_text = ""

[disks]
; Two MSCP slots (RQDX3-class).
; a = installed system disk (Open SIMH install).
; b = NetBSD 10.1 vax install ISO (optional second unit).
a = /disks/netbsd101-boot.dsk
b = /disks/CD-NetBSD-10.1-vax.iso
boot = a

[clock]
enabled = true

[ethernet]
; Secondary: DELQA-class guest Ethernet + NAT (vpdp1170 semantics).
enabled    = false
mac        = 08-00-2B-AA-00-01
guest_ip   = 10.11.0.2
guest_mask = 255.255.255.0
gateway_ip = 10.11.0.1

[diag]
; MSCP USB-serial dump. flags: csr,init,ring,cmd,xfer,irq,all (or hex 0x3F).
; count = max log lines (0 = off; -1 = unlimited).

;mscp_dump_flags = csr,init,ring,cmd,xfer,irq   ; or all / 0x3F
mscp_dump_flags =
mscp_dump_count = 0                            ; 0=off, -1=unlimited
