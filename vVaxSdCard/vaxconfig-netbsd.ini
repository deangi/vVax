; NetBSD-oriented profile — copy over /vaxconfig.ini on the SD card.
; Install media ISO is on MSCP B. After Open SIMH install, point a= at dua0.dsk.

[system]
title  = MicroVAX II / NetBSD
; Guest RAM in MB. Allowed values: 2, 4, or 6.
ram_mb = 6

[console]
boot_text = ""

[disks]
; dua0.dsk = installed RA/MSCP system (build on PC with Open SIMH, then copy).
; NetBSD-10.1-vax.iso = official install CD (~427 MB).
a = /disks/dua0.dsk
b = /disks/NetBSD-10.1-vax.iso
boot = a

[clock]
enabled = true

[ethernet]
enabled    = false
mac        = 08-00-2B-AA-00-01
guest_ip   = 10.11.0.2
guest_mask = 255.255.255.0
gateway_ip = 10.11.0.1
