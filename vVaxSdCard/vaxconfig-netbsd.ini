; NetBSD-oriented profile — copy over /vaxconfig.ini on the SD card.
; Install media ISO is on MSCP B. After Open SIMH install, point a= at dua0.dsk.

[system]
title  = VAX 11/750 / NetBSD
; Guest RAM in MB. Allowed values: 2, 4, 6, or 8.
; NetBSD needs 8 minimum
ram_mb = 8
os = netbsd

[console]
boot_text = ""

[disks]
; netbsd101-boot.img = installed RA/MSCP system (Open SIMH).
; CD-NetBSD-10.1-vax.iso = official install CD (~427 MB).
a = /disks/netbsd101-boot.dsk
b = /disks/CD-NetBSD-10.1-vax.iso
boot = a

[clock]
enabled = true

[ethernet]
enabled    = false
mac        = 08-00-2B-AA-00-01
guest_ip   = 10.11.0.2
guest_mask = 255.255.255.0
gateway_ip = 10.11.0.1

[diag]
; MSCP USB-serial dump. flags: csr,init,ring,cmd,xfer,irq,all (or hex 0x3F).
; count = max log lines (0 = off; -1 = unlimited).
mscp_dump_flags =
mscp_dump_count = 0
pctrace = off
